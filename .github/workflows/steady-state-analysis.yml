name: Steady-state analysis (one-off)
on:
  push:
    branches: [analysis/steady-state]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scikit-learn
      - run: python diag_today.py
      - run: python forecast.py && python -c "import json;f=json.load(open('forecast.json'));print(f['today_breakdown'], f['base']['reviews_mean'][:3])"
