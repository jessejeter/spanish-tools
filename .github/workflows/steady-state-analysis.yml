name: Steady-state analysis (one-off)
on:
  push:
    branches: [analysis/steady-state]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/steady-state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scikit-learn
      - run: pip install google-auth google-api-python-client && python check_sheet1.py
