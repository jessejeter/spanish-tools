name: Steady-state analysis (one-off)
on:
  push:
    branches: [analysis/steady-state]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy scikit-learn
      - run: python build_srs_keys.py && head -c 400 srs_keys.json && echo
      - name: Commit srs_keys.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add srs_keys.json
          git commit -m "Record which meaning owns each legacy review record"
          git pull --rebase origin main
          git push origin HEAD:main
